<rect x="0" y="0" width="680" height="883" rx="0" class="f-bg"/>
<text x="32.0" y="60.0" font-size="34" class="f-ink" text-anchor="start" font-weight="700">Widen first, then sharpen</text>
<text x="32.0" y="104.0" font-size="22" class="f-muted" text-anchor="start">On-policy distillation widens what the student model can</text>
<text x="32.0" y="134.0" font-size="22" class="f-muted" text-anchor="start">do; RL then sharpens within that range. Fused in one</text>
<text x="32.0" y="164.0" font-size="22" class="f-muted" text-anchor="start">step, the two signals interfere.</text>
