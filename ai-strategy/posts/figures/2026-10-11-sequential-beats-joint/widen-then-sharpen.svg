<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 883" width="680" height="883" role="img" aria-labelledby="t d">
<title id="t">Widen first, then sharpen</title>
<desc id="d">Diagram. Top row, sequential: a narrow student distribution sits inside a wider dashed range of teacher-supported solutions; an arrow labelled OPD widens leads to a wide distribution that fills that range; an arrow labelled RL sharpens leads to a tall, narrow peak inside it. Bottom row, fused: one distribution pulled outward and inward at once, labelled the signals interfere. OPD-then-RL beat every fused baseline on logic and math benchmarks.</desc>
