<text x="32.0" y="60.0" font-size="34" class="f-ink" text-anchor="start" font-weight="700">16 agents do what one agent does</text>
<text x="32.0" y="102.0" font-size="34" class="f-ink" text-anchor="start" font-weight="700">thinking 4.9 times as long</text>
<text x="32.0" y="146.0" font-size="22" class="f-muted" text-anchor="start">Each added agent adds less. With perfect teamwork the</text>
<text x="32.0" y="176.0" font-size="22" class="f-muted" text-anchor="start">curve would follow the dashed line; what Ord measured</text>
<text x="32.0" y="206.0" font-size="22" class="f-muted" text-anchor="start">sits far below it.</text>
