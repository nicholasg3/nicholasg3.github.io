<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 853" width="680" height="853" role="img" aria-labelledby="t d">
<title id="t">16 agents do what one agent does thinking 4.9 times as long</title>
<desc id="d">Line chart. Across, 1 to 16 agents working side by side. Up, how many times longer one agent must think to match them. A dashed diagonal shows perfect teamwork, reaching 16 at 16 agents. Ord’s measured range, exponents 0.48 to 0.68, curves far below it; his middle estimate reaches 4.9 at 16 agents.</desc>
