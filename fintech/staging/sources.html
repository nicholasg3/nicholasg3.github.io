<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Fintech · sources · private</title>
<link rel="stylesheet" href="/ai-strategy/styles.css">
<style>
.wrap{max-width:900px;margin:0 auto;padding:48px 24px 96px}
.locked{max-width:420px;margin:72px auto;padding:24px;border:1px solid var(--line);background:var(--sheet)}
.hidden{display:none!important}
input[type=password]{width:100%;padding:10px;margin:8px 0 12px;font:inherit}
button{padding:8px 14px;background:var(--ink);color:#fff;border:0;font:inherit;font-weight:700;cursor:pointer}
li{margin:8px 0} a{color:var(--blue)}
</style></head><body>
<header class="site-header"><a class="brand" href="./"><span class="brand-mark">N</span><span><strong>Fintech</strong><small>Sources</small></span></a></header>
<main>
<section id="gate" class="locked"><h1>Canonical sources · Fintech</h1>
<p id="err" style="color:var(--crimson)"></p>
<input id="password" type="password" autofocus>
<button id="go" type="button">Unlock</button></section>
<section id="app" class="wrap hidden">
<div class="issue-kicker">Private · proposed follow list</div>
<h1>Canonical sources</h1>
<p style="color:var(--muted)">Proposed from @yahoolovesyou harvest + doctrine fit. Not auto-followed until dedicated curator accounts exist.</p>
<div id="list">Loading…</div>
<p><a href="./">← Hub</a></p>
</section></main>
<script>
const HASH="ff854ad6c0b6c6a80a22e03946c0a6fd8bcb3fe3636ebeccc1c11e7cee1edc08"; const KEY="sp-vertical-auth-v1";
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function show(ok){document.getElementById("gate").classList.toggle("hidden",ok);document.getElementById("app").classList.toggle("hidden",!ok)}
async function load(){
  const res=await fetch("../data/sources.json?t="+Date.now(),{cache:"no-store"});
  if(!res.ok){document.getElementById("list").textContent="No sources.json yet.";return}
  const data=await res.json();
  document.getElementById("list").innerHTML="<ol>"+(data.sources||[]).map(s=>
    `<li><strong>${s.handle||s.name||""}</strong> — ${s.role||""}
     ${s.url?` · <a href="${s.url}" target="_blank" rel="noopener">profile</a>`:""}
     ${s.note?`<br><span style="color:var(--muted)">${s.note}</span>`:""}</li>`
  ).join("")+"</ol>";
}
document.getElementById("go").onclick=async()=>{
  if(await sha(document.getElementById("password").value||"")!==HASH){document.getElementById("err").textContent="Wrong password.";return}
  sessionStorage.setItem(KEY,"1");show(true);load();
};
if(sessionStorage.getItem(KEY)==="1"){show(true);load()}
</script></body></html>
